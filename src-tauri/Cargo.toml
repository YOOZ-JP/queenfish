[package]
name = "queenfish"
version = "0.1.0"
description = "Maccy-style menu bar viewer for Claude artifacts & usage across accounts"
edition = "2021"

[lib]
name = "queenfish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "gzip"] }
tokio = { version = "1", features = ["time", "process", "net", "io-util"] }
dirs = "6"
keyring = { version = "3", features = ["apple-native"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"
